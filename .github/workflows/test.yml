name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./internal/radiusd ./internal/web ./internal/attrs ./internal/store ./internal/letsencrypt
      - run: go test ./...
      - run: go build -o EasyRadius.exe .
